<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var URL_SUPABASE = 'https://hgmswhslnuqlzqbvuifw.supabase.co';
  var CLAVE_PUBLICA = 'sb_publishable_mJwquJGh9WzRrxCrrceZng_B0GynTvN';
  var VAPID_PUBLIC_KEY = 'BLBb_eng5V0_n__iZFFR3bKN-EpcbaLgSlcXrkMsj4SOK1HhvS2fbqUeNX2_5sDDKE-wTde4wB2j1Dxjgwcinjc';

  var sb = window.supabase.createClient(URL_SUPABASE, CLAVE_PUBLICA);
  var imagenBase64Principal = null;

  var esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  };

  function estado(texto) {
    var z = document.getElementById('zonaEstado');
    if (!texto) { z.innerHTML = ''; return; }
    z.innerHTML = '<div class="mensaje-estado error">' + esc(texto) + '</div>';
  }

  function cuando(iso) {
    var f = new Date(iso);
    var ahora = new Date();
    var mins = Math.round((ahora - f) / 60000);
    if (mins < 1) return 'ahora mismo';
    if (mins < 60) return 'hace ' + mins + ' min';
    var horas = Math.round(mins / 60);
    if (horas < 24) return 'hace ' + horas + (horas === 1 ? ' hora' : ' horas');
    return f.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }) + ' · ' +
           f.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  }

  function optimizarImagen(imgElement) {
    var canvas = document.createElement('canvas');
    var maxAncho = 1200;
    var escala = maxAncho / imgElement.width;
    
    if (escala < 1) {
      canvas.width = maxAncho;
      canvas.height = imgElement.height * escala;
    } else {
      canvas.width = imgElement.width;
      canvas.height = imgElement.height;
    }

    var ctx = canvas.getContext('2d');
    ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.82);
  }

  function renderCard(m, esRespuesta, rootPadreId) {
    var htmlImg = m.imagen ? '<a href="' + m.imagen + '" target="_blank"><img class="img-adjunta" src="' + m.imagen + '" alt="Imagen adjunta"></a>' : '';
    var claseExtra = esRespuesta ? ' respuesta' : '';
    var idPadreParaGuardar = esRespuesta ? rootPadreId : m.id;
    var numLikes = m.likes || 0;
    
    var dioLike = localStorage.getItem('like_' + m.id) === 'true';
    var iconoCorazon = dioLike ? '❤️' : '🤍';
    var claseLiked = dioLike ? ' liked' : '';

    var htmlAcciones = '<div class="acciones-msg">' +
      '<button class="btn-accion btn-like' + claseLiked + '" data-id="' + m.id + '" data-likes="' + numLikes + '">' +
        '<span>' + iconoCorazon + '</span> <span class="count">' + numLikes + '</span>' +
      '</button>' +
      '<button class="btn-accion btn-toggle-reply" data-id="' + m.id + '">💬 Responder</button>' +
      '<button class="btn-accion borrar" data-id="' + m.id + '">🗑️ Borrar</button>' +
    '</div>';

    var htmlFormRespuesta = '<div class="form-respuesta" id="reply-box-' + m.id + '" hidden>' +
      '<div class="campo"><label>Tu Nombre / Equipo</label><input type="text" id="reply-name-' + m.id + '" placeholder="Ej: Presi Rayo"></div>' +
      '<div class="campo"><label>Respuesta</label><textarea id="reply-text-' + m.id + '" placeholder="Escribe tu respuesta...">@' + esc(m.nombre) + ' </textarea></div>' +
      '<div class="campo"><label>Imagen (Opcional)</label><input type="file" id="reply-img-' + m.id + '" accept="image/*" style="color:var(--grey); font-size:0.8rem;"></div>' +
      '<button class="boton btn-send-reply" data-id="' + m.id + '" data-rootid="' + idPadreParaGuardar + '">Enviar Respuesta</button>' +
    '</div>';

    return '<div class="msg-card' + claseExtra + '">' +
      '<div class="cab">' +
        '<span class="autor">' + esc(m.nombre) + '</span>' +
        '<span class="cuando">' + esc(cuando(m.creado)) + '</span>' +
      '</div>' +
      '<div class="texto">' + esc(m.texto) + '</div>' +
      htmlImg +
      htmlAcciones +
      htmlFormRespuesta +
    '</div>';
  }

  function pintar(mensajes) {
    var cont = document.getElementById('lista');
    
    var principales = mensajes.filter(function(m){ return !m.mensaje_padre_id; });
    var respuestas = mensajes.filter(function(m){ return m.mensaje_padre_id; });

    document.getElementById('cuantos').textContent = principales.length;

    if (!principales.length) {
      cont.innerHTML = '<div class="aviso-suave">Todavía no hay ningún hilo. Estrénalo tú.</div>';
      return;
    }

    cont.innerHTML = '<div class="lista-msg">' + principales.map(function (p) {
      var misRespuestas = respuestas.filter(function(r){ return r.mensaje_padre_id === p.id; });
      misRespuestas.sort(function(a,b){ return new Date(a.creado) - new Date(b.creado); });

      var htmlRespuestas = misRespuestas.map(function(r){ return renderCard(r, true, p.id); }).join('');

      return '<div>' + renderCard(p, false, p.id) + htmlRespuestas + '</div>';
    }).join('') + '</div>';

    // Eventos
    cont.querySelectorAll('.btn-like').forEach(function (b) {
      b.addEventListener('click', function () { darLike(b.dataset.id, parseInt(b.dataset.likes, 10), b); });
    });

    cont.querySelectorAll('.borrar').forEach(function (b) {
      b.addEventListener('click', function () { borrar(b.dataset.id); });
    });

    cont.querySelectorAll('.btn-toggle-reply').forEach(function (b) {
      b.addEventListener('click', function () {
        var box = document.getElementById('reply-box-' + b.dataset.id);
        box.hidden = !box.hidden;
      });
    });

    cont.querySelectorAll('.btn-send-reply').forEach(function (b) {
      b.addEventListener('click', function () { enviarRespuesta(b.dataset.id, b.dataset.rootid); });
    });
  }

  async function cargar() {
    var r = await sb.from('mensajes')
      .select('id, creado, nombre, texto, imagen, mensaje_padre_id, likes')
      .order('creado', { ascending: false })
      .limit(150);
    if (r.error) { estado('No se han podido cargar los mensajes: ' + r.error.message); return; }
    estado('');
    pintar(r.data || []);
  }

  async function darLike(id, likesActuales, btnElement) {
    var key = 'like_' + id;
    var yaDioLike = localStorage.getItem(key) === 'true';

    // 1. Obtener la cifra real actualizada desde Supabase para evitar colisiones
    var resSelect = await sb.from('mensajes').select('likes').eq('id', id).single();
    var likesBaseDatos = (resSelect.data && resSelect.data.likes !== null) ? resSelect.data.likes : likesActuales;

    var nuevosLikes = yaDioLike ? Math.max(0, likesBaseDatos - 1) : likesBaseDatos + 1;

    // 2. Actualizar interfaz local
    var spanHeart = btnElement.querySelector('span:first-child');
    var spanCount = btnElement.querySelector('.count');
    
    if (yaDioLike) {
      localStorage.removeItem(key);
      btnElement.classList.remove('liked');
      spanHeart.textContent = '🤍';
    } else {
      localStorage.setItem(key, 'true');
      btnElement.classList.add('liked');
      spanHeart.textContent = '❤️';
    }
    
    spanCount.textContent = nuevosLikes;
    btnElement.dataset.likes = nuevosLikes;

    // 3. Persistir el cambio en Supabase
    var resUpdate = await sb.from('mensajes').update({ likes: nuevosLikes }).eq('id', id);
    if (resUpdate.error) {
      console.error('Error al guardar el like:', resUpdate.error.message);
    }
  }

  async function publicar() {
    var nombre = document.getElementById('nombre').value.trim();
    var caja = document.getElementById('texto');
    var texto = caja.value.trim();

    if (!nombre) { estado('Escribe tu nombre o equipo antes de publicar.'); return; }
    if (!texto && !imagenBase64Principal) { estado('Escribe un mensaje o adjunta una imagen.'); return; }

    var btn = document.getElementById('btnPublicar');
    btn.disabled = true;
    var r = await sb.from('mensajes').insert({
      nombre: nombre,
      texto: texto,
      imagen: imagenBase64Principal,
      likes: 0
    });
    btn.disabled = false;

    if (r.error) { estado('No se ha podido publicar: ' + r.error.message); return; }
    caja.value = '';
    limpiarImagenPrincipal();
    document.getElementById('contador').textContent = '0';
  }

  async function enviarRespuesta(msgId, rootPadreId) {
    var nomInput = document.getElementById('reply-name-' + msgId);
    var txtInput = document.getElementById('reply-text-' + msgId);
    var fileInput = document.getElementById('reply-img-' + msgId);

    var nombre = nomInput.value.trim();
    var texto = txtInput.value.trim();
    var file = fileInput.files[0];

    if (!nombre) { alert('Escribe tu nombre.'); return; }
    if (!texto && !file) { alert('Escribe un mensaje o elige una imagen.'); return; }

    var imgBase64 = null;
    if (file) {
      if (file.size > 5 * 1024 * 1024) { alert('La imagen no puede superar los 5 MB.'); return; }
      imgBase64 = await new Promise(function(resolve){
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() { resolve(optimizarImagen(img)); };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    var r = await sb.from('mensajes').insert({
      nombre: nombre,
      texto: texto,
      imagen: imgBase64,
      mensaje_padre_id: rootPadreId,
      likes: 0
    });

    if (r.error) { alert('Error al responder: ' + r.error.message); return; }
  }

  async function borrar(id) {
    if (!confirm('¿Borrar este mensaje?')) return;
    var r = await sb.from('mensajes').delete().eq('id', id);
    if (r.error) { estado('No se ha podido borrar: ' + r.error.message); return; }
  }

  function limpiarImagenPrincipal() {
    imagenBase64Principal = null;
    document.getElementById('inputImg').value = '';
    document.getElementById('contenedorPreview').hidden = true;
  }

  // Configuración de Supabase Realtime para actualizaciones instantáneas de likes y mensajes
  function activarRealtime() {
    sb.channel('realtime-tablon')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mensajes' }, function () {
        cargar();
      })
      .subscribe();
  }

  // Notificaciones Push
  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    var rawData = window.atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  function inicializarNotificaciones(reg) {
    var btn = document.getElementById('btnNotif');
    if (!btn) return;

    reg.pushManager.getSubscription().then(function (sub) {
      if (sub) {
        btn.textContent = '🔕 Desactivar notificaciones';
        btn.style.borderColor = 'var(--red)';
      } else {
        btn.textContent = '🔔 Activar notificaciones en el móvil';
        btn.style.borderColor = 'var(--gold-dim)';
      }
    });

    btn.onclick = function () {
      reg.pushManager.getSubscription().then(async function (sub) {
        if (sub) {
          await sub.unsubscribe();
          await sb.from('suscripciones').delete().eq('endpoint', sub.endpoint);
          alert('Notificaciones desactivadas.');
          btn.textContent = '🔔 Activar notificaciones en el móvil';
          btn.style.borderColor = 'var(--gold-dim)';
        } else {
          Notification.requestPermission().then(async function (perm) {
            if (perm === 'granted') {
              try {
                var nuevaSub = await reg.pushManager.subscribe({
                  userVisibleOnly: true,
                  applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
                });

                var subData = nuevaSub.toJSON();
                await sb.from('suscripciones').insert({
                  endpoint: subData.endpoint,
                  keys: subData.keys
                });

                alert('¡Notificaciones activadas con éxito!');
                btn.textContent = '🔕 Desactivar notificaciones';
                btn.style.borderColor = 'var(--red)';
              } catch (e) {
                alert('Error al suscribirse: ' + e.message);
              }
            } else {
              alert('Permiso denegado. Si usas iPhone, ve a Ajustes > Tu App > Notificaciones y actívalas.');
            }
          });
        }
      });
    };
  }

  if ('serviceWorker' in navigator && 'PushManager' in window) {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(function (reg) {
        inicializarNotificaciones(reg);
      })
      .catch(function (err) {
        console.error('Error al registrar Service Worker:', err);
      });
  }

  document.getElementById('inputImg').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { estado('La imagen es demasiado grande (máx 5MB).'); this.value = ''; return; }

    var reader = new FileReader();
    reader.onload = function (evt) {
      var img = new Image();
      img.onload = function () {
        imagenBase64Principal = optimizarImagen(img);
        document.getElementById('imgPreview').src = imagenBase64Principal;
        document.getElementById('contenedorPreview').hidden = false;
        estado('');
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('btnQuitarImg').addEventListener('click', limpiarImagenPrincipal);
  document.getElementById('btnPublicar').addEventListener('click', publicar);
  document.getElementById('texto').addEventListener('input', function () {
    document.getElementById('contador').textContent = this.value.length;
  });

  // Inicialización
  cargar();
  activarRealtime();
})();
</script>
