name: Actualizar datos de Biwenger

on:
  schedule:
        - cron: '0 6-21 * * *'  # 8:00-23:00 hora de España (UTC+2 en verano)
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Traer datos de Biwenger
        env:
          BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
          BIWENGER_LEAGUE: ${{ secrets.BIWENGER_LEAGUE }}
          BIWENGER_USER: ${{ secrets.BIWENGER_USER }}
        run: node scripts/fetch-biwenger.mjs
      - name: Guardar cambios
        run: |
          git config user.name "Johnny's League bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Datos actualizados"
          git push
